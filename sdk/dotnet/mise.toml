[tools]
dotnet = "10.0"

[tasks.build]
description = "Build the SDK for every target framework (protobuf bindings are generated at build time)"
run = "dotnet build --nologo -c Release"

[tasks.test]
description = "Run unit tests on every target framework"
run = "dotnet test --nologo -c Release"


[tasks.format]
description = "Verify formatting and analyzers"
run = "dotnet format --verify-no-changes --no-restore"

[tasks.pack]
description = "Create the NuGet package"
run = "dotnet pack --nologo -c Release src/OpenShell.Sdk -o artifacts"

[tasks.ci]
description = "Run the full .NET SDK CI pipeline"
depends = ["format", "build", "test:coverage", "pack"]

[tasks."test:coverage"]
description = "Run unit tests with coverage for hand-written code and print the summary (no gate; the goal is 100%)"
run = """
#!/usr/bin/env bash
set -euo pipefail

OUT="$(pwd -P)/TestResults/coverage"
rm -rf "$OUT"
dotnet test --nologo -c Release -f net10.0 \
  --coverage --coverage-output-format cobertura \
  --coverage-settings "$(pwd -P)/coverage.settings.xml" \
  --coverage-output "$OUT/coverage.cobertura.xml"

FILE=$(find "$OUT" -name '*.xml' | head -1)
echo "line coverage:   $(grep -o '<coverage [^>]*' "$FILE" | grep -o 'line-rate="[0-9.]*"' | head -1 | grep -o '[0-9.]*')"
echo "branch coverage: $(grep -o '<coverage [^>]*' "$FILE" | grep -o 'branch-rate="[0-9.]*"' | head -1 | grep -o '[0-9.]*')"
"""
